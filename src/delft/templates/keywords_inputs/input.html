{% load delft_tags %}
{% get_keyword_children_in_list keyword.slug as KEYWORD_DATA %}

<div class="col-lg-12 keyword-selection">
    <span><label>{{ keyword.name }}</label></span>
    <select id="{{ keyword.slug }}" multiple="multiple" required>
    </select>
</div>
<script>
  const data{{ keyword.id }} = JSON.parse('{{ KEYWORD_DATA|escapejs }}');
  const children{{ keyword.id }} = data{{ keyword.id }}.children;
  const defaultValues{{ keyword.id }} = data{{ keyword.id }}.default_values;
  keywordIds.push('#{{ keyword.slug }}');

  let currentValues{{ keyword.id }} = children{{ keyword.id }}.filter(
    keyword => $('*[name="resource-keywords"]').val().includes(keyword)
  )

  {# Put the default value #}
  if (currentValues{{ keyword.id }}.length === 0) {
    currentValues{{ keyword.id }} = defaultValues{{ keyword.id }}

    const existingValues{{ keyword.id }} = $('*[name="resource-keywords"]').val() || []
    defaultValues{{ keyword.id }}.filter(
      name => !existingValues{{ keyword.id }}.includes(name)
    ).map(name => {
      $('*[name="resource-keywords"]').append(`<option value="${name}" selected="selected">${name}</option>`)
    })
    $('*[name="resource-keywords"]').val([...existingValues{{ keyword.id }}, ...defaultValues{{ keyword.id }}])
  }

  {# Init value #}
  currentValues{{ keyword.id }}.map(name => {
    $('#{{ keyword.slug }}').append(`<option value="${name}" selected="selected">${name}</option>`)
  })
  $('#{{ keyword.slug }}').select2({
    tags: {% if tags %}true{% else %}false{% endif %},
    maximumSelectionLength: 4,
    ajax: {
      url: '/autocomplete_hierachical_keyword_child/?parent={{ keyword.slug }}{% if not keyword.id %}&is_init=True{% endif %}',
      dataType: 'json',
      processResults: function (data) {
        return {
          results: data.results.map(item => {
            item.id = item.text;
            return item
          }),
          pagination: data.pagination
        };
      }
    },
  });
  $('#{{ keyword.slug }}').change(evt => {
    const values = []
    $('*[name="resource-keywords"]').html('')
    keywordIds.map(id => {
      $(id).val().map(name => {
        values.push(name)
        $('*[name="resource-keywords"]').append(`<option value="${name}" selected="selected">${name}</option>`)
      })
    })
    $('*[name="resource-keywords"]').val(values)
  })
</script>
